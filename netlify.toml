# Next.js on Netlify — leave "Publish directory" empty in the UI.
# This app uses middleware + API routes; it is NOT a static `out/` site.

[build]
  command = "npm run build"
  # Must not be repo root when using @netlify/plugin-nextjs.
  # Plugin will create/handle final output; this just avoids root publish validation failure.
  publish = ".next"

[build.environment]
  # Netlify compares env VALUES to repo + build output.
  # R2_BUCKET_NAME is often a short word (e.g. "video") → false positives everywhere.
  # NEXT_PUBLIC_* values are intentionally inlined into client JS by Next.js.
  SECRETS_SCAN_OMIT_KEYS = "R2_BUCKET_NAME,NEXT_PUBLIC_FUNNEL_GATE_URL,NEXT_PUBLIC_FUNNEL_AD_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
